# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: getsafar_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: getsafar_db
    ports:
      - "5433:5432" # <-- Map Mac's 5433 to Docker's 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
